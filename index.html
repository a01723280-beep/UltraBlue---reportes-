<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraBlue / UltraDef México - Reportes Digitales</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
      :root{--blue:#1e3a8a;--blue-light:#2563eb;--gray:#f3f4f6;--red:#dc2626;--green:#16a34a;}
      *{box-sizing:border-box;}
      body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--gray);color:#111;}
      header{background:var(--blue);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
      header h1{font-size:18px;margin:0;}
      header button{background:#fff;color:var(--blue);border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer;}
      .container{max-width:900px;margin:0 auto;padding:24px;}
      .plant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:30px;}
      .plant-btn{background:var(--blue-light);color:#fff;border:none;padding:40px 20px;border-radius:14px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);}
      .section-title{font-size:16px;font-weight:bold;color:var(--blue);margin:24px 0 10px;text-transform:uppercase;}
      .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
      .report-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px;}
      .report-card b{color:var(--blue);}
      .report-card .actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
      .btn{border:none;padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold;}
      .btn-primary{background:var(--blue-light);color:#fff;}
      .btn-secondary{background:#e5e7eb;color:#111;}
      .btn-primary:disabled,.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
      .form-field{margin-bottom:16px;}
      .form-field label{display:block;font-weight:bold;margin-bottom:6px;font-size:14px;}
      .form-field input[type=text], .form-field input[type=number], .form-field input[type=date], .form-field input[type=time], .form-field select, .form-field textarea{
            width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px;background:#fff;
      }
      .yesno{display:flex;gap:16px;}
      .yesno label{font-weight:normal;display:flex;align-items:center;gap:6px;}
      .alert-range{color:var(--red);font-size:13px;margin-top:4px;display:none;font-weight:bold;}
      .readonly-box{background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:10px;font-size:14px;margin-bottom:16px;}
      .multi-fixed{display:flex;flex-wrap:wrap;gap:10px;}
      .multi-fixed label{background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;font-weight:normal;font-size:14px;}
      .form-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
      .banner{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-weight:bold;}
      .banner.ok{background:#dcfce7;color:#166534;}
      .back-link{background:none;border:none;color:var(--blue-light);font-weight:bold;cursor:pointer;padding:0;margin-bottom:14px;font-size:14px;}
    </style>
  </head>
  <body>
    <header>
        <h1 id="headerTitle">UltraBlue / UltraDef México</h1>
        <button id="homeBtn" style="display:none;">Inicio</button>
    </header>
    <div class="container" id="app"></div>
    <script>
      const PLANTS = [
        {id:'monterrey', name:'UltraBlue Planta Monterrey'},
        {id:'hermosillo', name:'UltraBlue Planta Hermosillo'},
        {id:'mexico', name:'UltraBlue Planta México'}
        ];
      const OPERADORES = ['Jahaziel Escobedo','Neder Escobedo','Francisco Oyervides','Martín González','Santiago Cerda'];
      const TANQUES = ['Tdef-1','Tdef-2','Tdef-3','Tdef-4'];
      const INSTRUCTORES = ['Ing. Francisco González','Jahaziel Escobedo'];
      const EQUIPOS_PC05 = {
         'Termohigrómetro': {funcion:'Medidor de temperatura y humedad', marca:'Huato', serie:'H23AIG064', codigo:'UDM-001'},
         'Copa de Densidad': {funcion:'Medición de peso específico', marca:'Modern Instruments', serie:'NA', codigo:'UDM-002'},
         'Medidor PH': {funcion:'Medir PH en solución líquida', marca:'Atago', serie:'5028227', codigo:'UDM-003'},
         'Refractómetro': {funcion:'Medir concentración de urea', marca:'Atago', serie:'SA914820', codigo:'UDM-004'},
         'Báscula': {funcion:'Medir peso en gramos', marca:'Rhino', serie:'BAORE3-01979-0025', codigo:'UDM-005'}
      };

      const f = {
          date:(key,label)=>({key,label,type:'date'}),
          time:(key,label)=>({key,label,type:'time'}),
          text:(key,label)=>({key,label,type:'text'}),
          textarea:(key,label)=>({key,label,type:'textarea'}),
          number:(key,label,opts)=>Object.assign({key,label,type:'number'},opts||{}),
          select:(key,label,options)=>({key,label,type:'select',options}),
          selectOther:(key,label,options)=>({key,label,type:'selectOther',options}),
          yesno:(key,label)=>({key,label,type:'yesno'}),
          dynamic:(key,label,listKey)=>({key,label,type:'dynamic',listKey}),
          multiFixed:(key,label,options)=>({key,label,type:'multiFixed',options})
      };

      function envasadoFields(tipo){
          const arr = [
                f.date('fecha','Fecha'), f.time('hora','Hora'),
                f.select('operador','Operador',OPERADORES),
                f.dynamic('lote','No. de lote','lotes'),
                f.select('tanqueAlmacenaje','Tanque de almacenaje',TANQUES),
                f.yesno('contaminantesExt','Contaminantes (inspección externa)'),
                f.select('inspInterna','Inspección visual interna',['Aprobado','No aprobado'])
              ];
          if(tipo==='Pipa'){
                arr.push(f.yesno('certificadoRevisado','Certificado revisado'));
                arr.push(f.select('estadoManguera','Estado de manguera',['Aprobado','No aprobado']));
                arr.push(f.text('unidadTrailer','No. de unidad/trailer'));
          } else {
                arr.push(f.text('noSello','No. de sello'));
          }
          arr.push(f.dynamic('cliente','Cliente','clientes'));
          arr.push(f.number('litros','Litros o volumen cargado'));
          if(tipo==='Tambor'||tipo==='Porrón'){
                arr.push(f.number('unidadesEnvasadas','No. de unidades envasadas'));
          }
          arr.push(f.yesno('muestraTomada','Muestra tomada'));
          return arr;
      }

      const FORMS = {
         'PO-01':{group:'PO', title:'Recepción de Urea', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('operador','Operador',OPERADORES),
               f.dynamic('lote','Lote No.','lotes'),
               f.number('numOrden','Número de Orden'),
               f.yesno('coaOk','Documentos coinciden con CoA'),
               f.yesno('ordenOk','Documentos coinciden con Orden'),
               f.select('estadoBolsa','Estado de bolsa',['Buena','Dañada','Húmeda']),
               f.yesno('bolsaAprobada','Bolsa aprobada'),
               f.selectOther('colorInsp','Inspección visual - Color',['Blanco','Amarillento','Gris']),
               f.yesno('colorAprobado','Color aprobado'),
               f.selectOther('olorInsp','Inspección visual - Olor',['Sin olor','Amoniaco leve','Amoniaco fuerte','Vinagre']),
               f.yesno('olorAprobado','Olor aprobado'),
               f.dynamic('proveedor','Proveedor','proveedores'),
               f.number('bolsasOrdenadas','No. de bolsas ordenadas'),
               f.number('bolsasRecibidas','No. de bolsas recibidas'),
               f.yesno('loteAprobado','Lote aprobado'),
               f.yesno('muestraTomada','Muestra tomada')
            ]},
         'PO-02':{group:'PO', title:'Recepción e Inspección de Totes (IBC)', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('operador','Operador',OPERADORES),
               f.yesno('documentacionCompleta','Documentación completa'),
               f.yesno('contaminantes','Contaminantes superficiales detectados'),
               f.number('totesOrdenados','No. de totes ordenados'),
               f.number('totesRecibidos','No. de totes recibidos'),
               f.number('totesRechazados','No. de totes rechazados')
            ]},
         'PO-03':{group:'PO', title:'Producción / Mezclado de Urea', fields:[
               f.date('fecha','Fecha'), f.time('horaInicio','Hora inicio'), f.time('horaFinal','Hora final'),
               f.select('operador','Operador',OPERADORES),
               f.dynamic('loteMP','No. de lote materia prima','lotes'),
               f.number('bolsasUsadas','Cantidad de bolsas usadas'),
               f.text('loteProducido','No. de lote producido'),
               f.number('roAgua','RO Agua (m3)'),
               f.number('tempAgua','Temperatura promedio del agua',{min:38, popupAlert:'El agua no está dentro del rango de temperatura (mínimo 38°C).'}),
               f.number('concentraciónUrea','Concentración de urea %',{min:31.8,max:33.2}),
               f.number('ureaTanque','% Urea en tanque'),
               f.select('tanque','No. de tanque',TANQUES),
               f.yesno('muestraTomada','Muestra tomada')
            ]},
         'PO-04':{group:'PO', title:'Envasado de Pipa', fields:envasadoFields('Pipa')},
         'PO-05':{group:'PO', title:'Envasado de Tote (IBC)', fields:envasadoFields('Tote')},
         'PO-06':{group:'PO', title:'Envasado de Tambor 200 Lts', fields:envasadoFields('Tambor')},
         'PO-07':{group:'PO', title:'Envasado de Porrón 20 Lts', fields:envasadoFields('Porrón')},
         'PO-08':{group:'PO', title:'Limpieza de Mixer', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('operador','Operador',OPERADORES),
               f.yesno('t1','Limpieza de filtro Y (diario)'),
               f.yesno('t2','Mezclador libre de obstrucciones (diario)'),
               f.yesno('t3','Revisión de fugas en el sistema (diario)'),
               f.yesno('t4','Eliminar fibras del tanque de Urea (diario)'),
               f.yesno('t5','Limpieza de tolva y Mixer (diario)'),
               f.yesno('t6','Proceso de limpieza de máquina (semanal)'),
               f.yesno('t7','Limpieza de serpentín interior (semanal)'),
               f.yesno('t8','Limpieza de Conveyor (mensual)'),
               f.yesno('t9','Inspección de tornillos y abrazaderas (mensual)'),
               f.textarea('observaciones','Observaciones (opcional)')
            ]},
         'PO-09':{group:'PO', title:'Control de Ósmosis', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('unidad','Unidad de Ósmosis',['Ósmosis 1','Ósmosis 2']),
               f.number('filtroCarbónEntrada','Filtro Carbón Entrada'),
               f.number('filtroCarbónSalida','Filtro Carbón Salida'),
               f.number('presionPreFiltro','Presión Pre Filtro'),
               f.number('presionPosFiltro','Presión Pos Filtro'),
               f.number('presionAlimentación','Presión de Alimentación a Ósmosis'),
               f.number('presionRechazado','Presión de Rechazado de Ósmosis'),
               f.number('flujoProducto','Flujo de Producto'),
               f.number('flujoRechazo','Flujo de Rechazo'),
               f.number('flujoRecirculación','Flujo de Recirculación'),
               f.number('durezaEntrada','Dureza de entrada a suavizador'),
               f.number('durezaSalida','Dureza de salida de suavizador'),
               f.number('ph','PH'),
               f.number('conductividadAlim','Conductividad Alimentación'),
               f.number('conductividadProd','Conductividad de Producto')
            ]},
         'PO-10':{group:'PO', title:'Reporte de Entrenamiento', fields:[
               f.date('fecha','Fecha'),
               f.select('instructor','Instructor',INSTRUCTORES),
               f.multiFixed('trabajadores','Trabajador(es)',OPERADORES),
               f.text('tema','Tema'),
               f.select('categoriaVerificación','Verificación de conocimiento',['Plática verbal','Entrenamiento en sitio','Lectura de manual','Evaluación práctica']),
               f.textarea('detalleVerificación','Detalle adicional (opcional)')
            ]},
         'PC-01':{group:'PC', title:'Recepción de Urea (Calidad)', fields:[
               f.date('fecha','Fecha'),
               f.dynamic('lote','Lote No.','lotes'),
               f.yesno('revisionCoA','Revisión CoA'),
               f.select('estadoBolsa','Estado de bolsa',['Buena','Dañada','Húmeda']),
               f.select('aprobacionBolsa','Aprobación bolsa',['Aprobado','No aprobado']),
               f.selectOther('inspColor','Inspección Color',['Blanco','Amarillento','Gris']),
               f.select('aprobacionColor','Color aprobado',['Aprobado','No aprobado']),
               f.selectOther('inspOlor','Inspección Olor',['Sin olor','Amoniaco leve','Amoniaco fuerte','Vinagre']),
               f.select('aprobacionOlor','Olor aprobado',['Aprobado','No aprobado']),
               f.number('numBolsas','No. de bolsas'),
               f.yesno('muestraFísica20','Muestra física 20% tomada'),
               f.dynamic('laboratorio','Laboratorio','laboratorios'),
               f.select('resultado','Resultado',['Aprobado','Rechazado'])
            ]},
         'PC-02':{group:'PC', title:'Aceptación de Lote', fields:[
               f.date('fecha','Fecha'),
               f.select('operador','Operador',OPERADORES),
               f.dynamic('loteProducción','No. de lote producción','lotes'),
               f.select('tanque','No. de tanque',TANQUES),
               f.number('ureaTanque','% Urea en tanque'),
               f.number('ureaRefractómetro','% Urea en refractómetro',{min:31.8,max:33.2}),
               f.number('medicionPH','Medición PH',{min:9,max:10}),
               f.number('pesoEspecífico','Peso específico',{min:1.087,max:1.093}),
               f.yesno('muestraPlanta','Muestra en Planta'),
               f.yesno('muestraLaboratorio','Muestra en Laboratorio')
            ]},
         'PC-03':{group:'PC', title:'Control de Muestras', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('operador','Operador',OPERADORES),
               f.dynamic('loteProducción','No. de lote producción','lotes'),
               f.select('tanque','No. de tanque',TANQUES),
               f.number('porcentajeUrea','% Urea',{min:31.8,max:33.2}),
               f.dynamic('puntoMuestreo','Punto de muestreo','puntosMuestreo'),
               f.date('fechaAnálisis','Fecha de análisis'),
               f.select('envío','Envío interno/externo',['Interno','Externo']),
               f.yesno('muestraTomada','Muestra tomada')
            ]},
         'PC-04':{group:'PC', title:'Producto No Conforme', fields:[
               f.date('fecha','Fecha'), f.time('hora','Hora'),
               f.select('operador','Operador',OPERADORES),
               f.select('tanque','No. de tanque',TANQUES),
               f.yesno('tanquePNCEtiquetado','Tanque PNC etiquetado'),
               f.date('fechaLlenadoEnvase','Fecha de llenado del envase'),
               f.yesno('limpiezaTanque','Limpieza del tanque después del PNC'),
               f.date('fechaEmpaque','Fecha de empaque'),
               f.date('fechaEnvío','Fecha de envío'),
               f.dynamic('lugarEnvío','Lugar de envío','lugaresEnvío')
            ]},
         'PC-05':{group:'PC', title:'Registro de Equipos (Calibración)', fields:[]},
         'EV-01':{group:'EV', title:'Reporte de Evidencias', fields:[]}
      };


      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyjFeIbwMppXZ_9nhkt61bljaPRcuaiAtIDEFSeEXKqX2Dkfhor4Bm0andFjphj6AgI/exec'; let state = { view:'home', plant:null, formId:null };

      function storageKeyRecords(plant, formId){ return 'ub_'+plant+'_records_'+formId; }
      function storageKeyList(plant, listKey){ return 'ub_'+plant+'_list_'+listKey; }

      function getList(plant, listKey){
          const raw = localStorage.getItem(storageKeyList(plant, listKey));
          return raw ? JSON.parse(raw) : [];
      }
      function addToList(plant, listKey, value){
          if(!value) return;
          const list = getList(plant, listKey);
          if(!list.includes(value)){ list.push(value); localStorage.setItem(storageKeyList(plant, listKey), JSON.stringify(list)); }
      }
      function getRecords(plant, formId){
          const raw = localStorage.getItem(storageKeyRecords(plant, formId));
          return raw ? JSON.parse(raw) : [];
      }
      function saveRecord(plant, formId, record){
          const records = getRecords(plant, formId);
          records.push(record);
          localStorage.setItem(storageKeyRecords(plant, formId), JSON.stringify(records)); sendToCloud(plant, formId, record);
      }

      function clearRecords(plant, formId){ localStorage.removeItem(storageKeyRecords(plant, formId)); } function sendToCloud(plant, formId, record){ try{ fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({plant:plant, reportCode:formId, record:record})}); }catch(e){} } function validateComplete(controls){ const missing = controls.filter(function(c){ if(c.field.label && c.field.label.indexOf('(opcional)')!==-1) return false; const v = c.getValue(); return v===undefined || v===null || v.toString().trim()===''; }); return missing; } function pad(n){return n.toString().padStart(2,'0');}
      function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
      function nowTimeStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }

      const app = document.getElementById('app');
      const homeBtn = document.getElementById('homeBtn');
      const headerTitle = document.getElementById('headerTitle');

      homeBtn.addEventListener('click', function(){ state={view:'home',plant:null,formId:null}; render(); });

      function render(){
          app.innerHTML='';
          homeBtn.style.display = state.view==='home' ? 'none':'inline-block';
          if(state.view==='home') renderHome();
          else if(state.view==='menu') renderMenu();
          else if(state.view==='form') renderForm();
      }

      function renderHome(){
          headerTitle.textContent = 'UltraBlue / UltraDef México';
          const wrap = document.createElement('div');
          const h2 = document.createElement('h2');
          h2.textContent='Selecciona tu planta';
          wrap.appendChild(h2);
          const grid = document.createElement('div');
          grid.className='plant-grid';
          PLANTS.forEach(function(p){
                const btn = document.createElement('button');
                btn.className='plant-btn';
                btn.textContent = p.name;
                btn.addEventListener('click', function(){ state={view:'menu', plant:p.id, formId:null}; render(); });
                grid.appendChild(btn);
          });
          wrap.appendChild(grid);
          app.appendChild(wrap);
      }


      function renderMenu(){
          const plantObj = PLANTS.find(function(p){return p.id===state.plant;});
          headerTitle.textContent = plantObj.name;
          const wrap = document.createElement('div');

          const back = document.createElement('button');
          back.className='back-link';
          back.textContent='<- Cambiar de planta';
          back.addEventListener('click', function(){ state={view:'home',plant:null,formId:null}; render(); });
          wrap.appendChild(back);

          ['PO','PC','EV'].forEach(function(group){
                const title = document.createElement('div');
                title.className='section-title';
                title.textContent = group==='PO' ? 'Reportes de Operaciones (PO)' : (group==='PC' ? 'Reportes de Calidad (PC)' : 'REPORTE DE EVIDENCIAS');
                wrap.appendChild(title);
                const grid = document.createElement('div');
                grid.className='report-grid';
                Object.keys(FORMS).filter(function(k){return FORMS[k].group===group;}).forEach(function(code){
                        const card = document.createElement('div');
                        card.className='report-card';
                        const count = getRecords(state.plant, code).length;
                        const bEl=document.createElement('b'); bEl.textContent=code;
                        const spanTitle=document.createElement('span'); spanTitle.textContent=FORMS[code].title;
                        const spanCount=document.createElement('span'); spanCount.style.fontSize='12px'; spanCount.style.color='#666';
                        spanCount.textContent=count+' registro(s) guardado(s)';
                        card.appendChild(bEl); card.appendChild(spanTitle); card.appendChild(spanCount);
                        const actions = document.createElement('div');
                        actions.className='actions';
                        const openBtn = document.createElement('button');
                        openBtn.className='btn btn-primary';
                        openBtn.textContent='Llenar formulario';
                        openBtn.addEventListener('click', function(){ state={view:'form',plant:state.plant,formId:code}; render(); });
                        const exportBtn = document.createElement('button');
                        exportBtn.className='btn btn-secondary';
                        exportBtn.textContent='Descargar Excel';
                        exportBtn.disabled = count===0;
                        exportBtn.addEventListener('click', function(){ exportToExcel(state.plant, code); });
                        actions.appendChild(openBtn);
                        actions.appendChild(exportBtn);
                        card.appendChild(actions);
                        grid.appendChild(card);
                });
                wrap.appendChild(grid);
          });
          app.appendChild(wrap);
      }

      function exportToExcel(plant, formId){
          const records = getRecords(plant, formId);
          if(records.length===0){ alert('No hay registros guardados para este reporte todavía.'); return; }
          const ws = XLSX.utils.json_to_sheet(records);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, formId);
          const plantName = PLANTS.find(function(p){return p.id===plant;}).name.replace(/[^a-zA-Z0-9]+/g,'_');
          XLSX.writeFile(wb, formId+'_'+plantName+'.xlsx');
      }


      function renderField(field, plant){
          const wrap = document.createElement('div');
          wrap.className='form-field';
          const label = document.createElement('label');
          label.textContent = field.label;
          wrap.appendChild(label);
          let getValue;
          if(field.type==='date'){
                const input=document.createElement('input'); input.type='date'; input.value=todayStr();
                wrap.appendChild(input);
                getValue=function(){return input.value;};
          } else if(field.type==='time'){
                const input=document.createElement('input'); input.type='time'; input.value=nowTimeStr();
                wrap.appendChild(input);
                getValue=function(){return input.value;};
          } else if(field.type==='text'){
                const input=document.createElement('input'); input.type='text';
                wrap.appendChild(input);
                getValue=function(){return input.value;};
          } else if(field.type==='textarea'){
                const ta=document.createElement('textarea'); ta.rows=3;
                wrap.appendChild(ta);
                getValue=function(){return ta.value;};
          } else if(field.type==='number'){
                const input=document.createElement('input'); input.type='number'; input.step='any';
                wrap.appendChild(input);
                if(field.min!==undefined || field.max!==undefined){
                        const alertEl=document.createElement('div');
                        alertEl.className='alert-range';
                        if(field.min!==undefined && field.max!==undefined){ alertEl.textContent='Fuera de rango ('+field.min+' - '+field.max+')'; }
                        else if(field.min!==undefined){ alertEl.textContent='Por debajo del mínimo permitido ('+field.min+')'; }
                        else { alertEl.textContent='Por encima del máximo permitido ('+field.max+')'; }
                        wrap.appendChild(alertEl);
                        let alerted=false;
                        function outOfRange(v){ return !isNaN(v) && ((field.min!==undefined && v<field.min) || (field.max!==undefined && v>field.max)); }
                        input.addEventListener('input', function(){
                                  const v=parseFloat(input.value);
                                  if(outOfRange(v)){ alertEl.style.display='block'; } else { alertEl.style.display='none'; alerted=false; }
                        });
                        if(field.popupAlert){
                                  input.addEventListener('change', function(){
                                            const v=parseFloat(input.value);
                                            if(outOfRange(v) && !alerted){ alert(field.popupAlert); alerted=true; }
                                  });
                        }
                }
                getValue=function(){return input.value;};
          } else if(field.type==='select'){
                const sel=document.createElement('select');
                const blank=document.createElement('option'); blank.value=''; blank.textContent='-- Selecciona --';
                sel.appendChild(blank);
                field.options.forEach(function(o){ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
                wrap.appendChild(sel);
                getValue=function(){return sel.value;};
          } else if(field.type==='selectOther'){
                const sel=document.createElement('select');
                const blank=document.createElement('option'); blank.value=''; blank.textContent='-- Selecciona --';
                sel.appendChild(blank);
                field.options.forEach(function(o){ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
                const otherOp=document.createElement('option'); otherOp.value='Otro'; otherOp.textContent='Otro'; sel.appendChild(otherOp);
                wrap.appendChild(sel);
                const otherInput=document.createElement('input'); otherInput.type='text'; otherInput.placeholder='Especifica...'; otherInput.style.marginTop='8px'; otherInput.style.display='none';
                wrap.appendChild(otherInput);
                sel.addEventListener('change', function(){ otherInput.style.display = sel.value==='Otro' ? 'block':'none'; });
                getValue=function(){ return sel.value==='Otro' ? (otherInput.value || 'Otro') : sel.value; };
          } else if(field.type==='yesno'){
                const div=document.createElement('div'); div.className='yesno';
                const name='yn_'+field.key+'_'+Math.random().toString(36).slice(2);
                ['Si','No'].forEach(function(opt){
                        const l=document.createElement('label');
                        const r=document.createElement('input'); r.type='radio'; r.name=name; r.value=opt;
                        l.appendChild(r); l.appendChild(document.createTextNode(opt));
                        div.appendChild(l);
                });
                wrap.appendChild(div);
                getValue=function(){ const checked=div.querySelector('input[type=radio]:checked'); return checked?checked.value:''; };
          } else if(field.type==='dynamic'){
                const input=document.createElement('input'); input.type='text';
                const listId='dl_'+field.key+'_'+Math.random().toString(36).slice(2);
                const datalist=document.createElement('datalist'); datalist.id=listId;
                getList(plant, field.listKey).forEach(function(v){ const op=document.createElement('option'); op.value=v; datalist.appendChild(op); });
                input.setAttribute('list', listId);
                wrap.appendChild(input); wrap.appendChild(datalist);
                getValue=function(){return input.value;};
          } else if(field.type==='multiFixed'){
                const div=document.createElement('div'); div.className='multi-fixed';
                const checks=[];
                field.options.forEach(function(opt){
                        const l=document.createElement('label');
                        const c=document.createElement('input'); c.type='checkbox'; c.value=opt;
                        checks.push(c);
                        l.appendChild(c); l.appendChild(document.createTextNode(' '+opt));
                        div.appendChild(l);
                });
                wrap.appendChild(div);
                getValue=function(){ return checks.filter(function(c){return c.checked;}).map(function(c){return c.value;}).join(', '); };
          } else {
                const input=document.createElement('input'); input.type='text';
                wrap.appendChild(input);
                getValue=function(){return input.value;};
          }
          return {wrapper:wrap, getValue:getValue, field:field};
      }


      function renderForm(){
          const formDef = FORMS[state.formId];
          const plantObj = PLANTS.find(function(p){return p.id===state.plant;});
          headerTitle.textContent = plantObj.name+' - '+state.formId;
          const wrap = document.createElement('div');

          const back = document.createElement('button');
          back.className='back-link';
          back.textContent='<- Volver al menú de reportes';
          back.addEventListener('click', function(){ state={view:'menu',plant:state.plant,formId:null}; render(); });
          wrap.appendChild(back);

          const h2 = document.createElement('h2');
          h2.textContent = state.formId+' - '+formDef.title;
          wrap.appendChild(h2);

          const banner = document.createElement('div');
          banner.className='banner ok';
          banner.style.display='none';
          banner.textContent='Registro guardado correctamente.';
          wrap.appendChild(banner);

          const formEl = document.createElement('div');

          if(state.formId==='PC-05'){
                renderPC05(formEl, banner);
          } else if(state.formId==='EV-01'){
                renderEvidencias(formEl, banner);
          } else {
                const controls = formDef.fields.map(function(field){return renderField(field, state.plant);});
                controls.forEach(function(c){formEl.appendChild(c.wrapper);});

                const actions = document.createElement('div'); actions.className='form-actions';
                const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.textContent='Guardar registro';
                saveBtn.addEventListener('click', function(){
                        const missing=validateComplete(controls); if(missing.length>0){ alert('Estás enviando un reporte incompleto. Debes completar todos los campos. Falta: '+missing.map(function(c){return c.field.label;}).join(', ')); return; } const record={};
                        controls.forEach(function(c){ record[c.field.label]=c.getValue(); });
                        saveRecord(state.plant, state.formId, record);
                        controls.forEach(function(c){
                                  if(c.field.type==='dynamic'){ addToList(state.plant, c.field.listKey, c.getValue()); }
                        });
                        banner.style.display='block';
                        setTimeout(function(){ state={view:'form',plant:state.plant,formId:state.formId}; render(); }, 900);
                });
                const exportBtn=document.createElement('button'); exportBtn.className='btn btn-secondary'; exportBtn.textContent='Descargar Excel de este reporte';
                exportBtn.addEventListener('click', function(){ exportToExcel(state.plant, state.formId); });
                actions.appendChild(saveBtn); actions.appendChild(exportBtn);
                formEl.appendChild(actions);
          }

          wrap.appendChild(formEl);
          app.appendChild(wrap);
      }


      function renderPC05(formEl, banner){
          const equipoWrap=document.createElement('div'); equipoWrap.className='form-field';
          const label=document.createElement('label'); label.textContent='Equipo';
          const sel=document.createElement('select');
          const blank=document.createElement('option'); blank.value=''; blank.textContent='-- Selecciona --'; sel.appendChild(blank);
          Object.keys(EQUIPOS_PC05).forEach(function(k){ const op=document.createElement('option'); op.value=k; op.textContent=k; sel.appendChild(op); });
          equipoWrap.appendChild(label); equipoWrap.appendChild(sel);
          formEl.appendChild(equipoWrap);

          const infoBox=document.createElement('div'); infoBox.className='readonly-box'; infoBox.style.display='none';
          formEl.appendChild(infoBox);

          const fechaCalWrap=document.createElement('div'); fechaCalWrap.className='form-field';
          const fechaCalLabel=document.createElement('label'); fechaCalLabel.textContent='Fecha de calibración';
          const fechaCalInput=document.createElement('input'); fechaCalInput.type='date'; fechaCalInput.value=todayStr();
          fechaCalWrap.appendChild(fechaCalLabel); fechaCalWrap.appendChild(fechaCalInput);
          formEl.appendChild(fechaCalWrap);

          const fechaRecalWrap=document.createElement('div'); fechaRecalWrap.className='form-field';
          const fechaRecalLabel=document.createElement('label'); fechaRecalLabel.textContent='Fecha de recalibración (calculada: +3 años)';
          const fechaRecalBox=document.createElement('div'); fechaRecalBox.className='readonly-box';
          fechaRecalWrap.appendChild(fechaRecalLabel); fechaRecalWrap.appendChild(fechaRecalBox);
          formEl.appendChild(fechaRecalWrap);

          function updateRecal(){
                if(!fechaCalInput.value){ fechaRecalBox.textContent='-'; return; }
                const d=new Date(fechaCalInput.value+'T00:00:00');
                d.setFullYear(d.getFullYear()+3);
                fechaRecalBox.textContent = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
          }
          fechaCalInput.addEventListener('input', updateRecal);
          updateRecal();

          sel.addEventListener('change', function(){
                const eq=EQUIPOS_PC05[sel.value];
                if(eq){
                        infoBox.style.display='block';
                        infoBox.innerHTML = '<b>Funcionamiento:</b> '+eq.funcion+'<br><b>Marca:</b> '+eq.marca+'<br><b>Serie:</b> '+eq.serie+'<br><b>Código interno:</b> '+eq.codigo;
                } else { infoBox.style.display='none'; }
          });

          const actions=document.createElement('div'); actions.className='form-actions';
          const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.textContent='Guardar registro';
          saveBtn.addEventListener('click', function(){
                if(!sel.value){ alert('Estás enviando un reporte incompleto. Selecciona un equipo.'); return; }
                const eq=EQUIPOS_PC05[sel.value];
                const record={
                        'Equipo':sel.value, 'Funcionamiento':eq.funcion,'Marca':eq.marca,'Serie':eq.serie,'Código interno':eq.codigo,
                        'Fecha de calibración':fechaCalInput.value, 'Fecha de recalibración':fechaRecalBox.textContent
                };
                saveRecord(state.plant,'PC-05',record);
                banner.style.display='block';
                setTimeout(function(){ state={view:'form',plant:state.plant,formId:'PC-05'}; render(); }, 900);
          });
          const exportBtn=document.createElement('button'); exportBtn.className='btn btn-secondary'; exportBtn.textContent='Descargar Excel de este reporte';
          exportBtn.addEventListener('click', function(){ exportToExcel(state.plant,'PC-05'); });
          actions.appendChild(saveBtn); actions.appendChild(exportBtn);
          formEl.appendChild(actions);
      }

      function renderEvidencias(formEl, banner){
      const fechaWrap=document.createElement('div'); fechaWrap.className='form-field';
      const fechaLabel=document.createElement('label'); fechaLabel.textContent='Fecha';
      const fechaInput=document.createElement('input'); fechaInput.type='date'; fechaInput.value=todayStr();
      fechaWrap.appendChild(fechaLabel); fechaWrap.appendChild(fechaInput);
      formEl.appendChild(fechaWrap);

      const horaWrap=document.createElement('div'); horaWrap.className='form-field';
      const horaLabel=document.createElement('label'); horaLabel.textContent='Hora';
      const horaInput=document.createElement('input'); horaInput.type='time'; horaInput.value=nowTimeStr();
      horaWrap.appendChild(horaLabel); horaWrap.appendChild(horaInput);
      formEl.appendChild(horaWrap);

      const opWrap=document.createElement('div'); opWrap.className='form-field';
      const opLabel=document.createElement('label'); opLabel.textContent='Operador';
      const opSel=document.createElement('select');
      const opBlank=document.createElement('option'); opBlank.value=''; opBlank.textContent='-- Selecciona --'; opSel.appendChild(opBlank);
      OPERADORES.forEach(function(o){ const op=document.createElement('option'); op.value=o; op.textContent=o; opSel.appendChild(op); });
      opWrap.appendChild(opLabel); opWrap.appendChild(opSel);
      formEl.appendChild(opWrap);

      const fotoWrap=document.createElement('div'); fotoWrap.className='form-field';
      const fotoLabel=document.createElement('label'); fotoLabel.textContent='Evidencia fotográfica';
      const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*'; fileInput.setAttribute('capture','environment'); fileInput.style.display='none';
      const camBtn=document.createElement('button'); camBtn.type='button'; camBtn.className='btn btn-secondary'; camBtn.style.display='inline-flex'; camBtn.style.alignItems='center'; camBtn.style.gap='8px';
      const camIcon=document.createElement('span'); camIcon.textContent='📷'; camIcon.style.fontSize='20px'; camIcon.style.lineHeight='1';
      const camText=document.createElement('span'); camText.textContent='Tomar / Subir foto';
      camBtn.appendChild(camIcon); camBtn.appendChild(camText);
      camBtn.addEventListener('click', function(){ fileInput.click(); });
      const fileNameLabel=document.createElement('div'); fileNameLabel.style.marginTop='6px'; fileNameLabel.style.fontSize='13px'; fileNameLabel.style.color='#374151';
      const preview=document.createElement('img'); preview.style.maxWidth='220px'; preview.style.display='none'; preview.style.marginTop='8px'; preview.style.borderRadius='6px'; preview.style.border='1px solid #ccc';
      fotoWrap.appendChild(fotoLabel); fotoWrap.appendChild(camBtn); fotoWrap.appendChild(fileNameLabel); fotoWrap.appendChild(fileInput); fotoWrap.appendChild(preview);
      formEl.appendChild(fotoWrap);
      
            let photoData='';
            fileInput.addEventListener('change', function(){
        const file=fileInput.files[0];
        if(!file){ photoData=''; preview.style.display='none'; fileNameLabel.textContent=''; return; }
        fileNameLabel.textContent='✓ '+file.name;
        const reader=new FileReader();
        reader.onload=function(ev){
          const img=new Image();
          img.onload=function(){
            const maxW=900;
            const scale=Math.min(1, maxW/img.width);
            const canvas=document.createElement('canvas');
            canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
            const ctx=canvas.getContext('2d');
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            photoData=canvas.toDataURL('image/jpeg', 0.7);
            preview.src=photoData; preview.style.display='block';
          };
          img.src=ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      const explicWrap=document.createElement('div'); explicWrap.className='form-field';
      const explicLabel=document.createElement('label'); explicLabel.textContent='Explicación de la situación (opcional)';
      const explicTa=document.createElement('textarea'); explicTa.rows=3;
      explicWrap.appendChild(explicLabel); explicWrap.appendChild(explicTa);
      formEl.appendChild(explicWrap);

      const actions=document.createElement('div'); actions.className='form-actions';
      const saveBtn=document.createElement('button'); saveBtn.className='btn btn-primary'; saveBtn.textContent='Guardar registro';
      saveBtn.addEventListener('click', function(){
        if(!opSel.value){ alert('Estás enviando un reporte incompleto. Selecciona un operador.'); return; }
        if(!photoData){ alert('Estás enviando un reporte incompleto. Debes adjuntar una evidencia fotográfica.'); return; }
        const localRecord={
          'Fecha':fechaInput.value, 'Hora':horaInput.value, 'Operador':opSel.value,
          'Evidencia fotográfica':'Foto adjuntada (ver Google Sheets/Drive)',
          'Explicación de la situación':explicTa.value
        };
        const cloudRecord={
          'Fecha':fechaInput.value, 'Hora':horaInput.value, 'Operador':opSel.value,
          'Evidencia fotográfica':photoData,
          'Explicación de la situación':explicTa.value
        };
        const records=getRecords(state.plant, 'EV-01');
        records.push(localRecord);
        localStorage.setItem(storageKeyRecords(state.plant, 'EV-01'), JSON.stringify(records));
        sendToCloud(state.plant, 'EV-01', cloudRecord);
        banner.style.display='block';
        setTimeout(function(){ state={view:'form',plant:state.plant,formId:'EV-01'}; render(); }, 900);
      });
      const exportBtn=document.createElement('button'); exportBtn.className='btn btn-secondary'; exportBtn.textContent='Descargar Excel de este reporte';
      exportBtn.addEventListener('click', function(){ exportToExcel(state.plant,'EV-01'); });
      actions.appendChild(saveBtn); actions.appendChild(exportBtn);
      formEl.appendChild(actions);
      }

      render();
    </script>
  </body>
